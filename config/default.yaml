hotkey:
  modifiers: ["ctrl", "shift"]
  key: "d"

speech:
  primary_engine: "faster_whisper"
  fallback_engine: "vosk"
  auto_fallback: true
  
  faster_whisper:
    model_size: "base"
    device: "cpu"
    compute_type: "int8"
  
  vosk:
    model_path: null  # Will download default

processing:
  mode: "smart"

ui:
  show_widget: true
  play_sounds: true
  widget_position: null

injection:
  method: "auto"
  short_text_threshold: 20
